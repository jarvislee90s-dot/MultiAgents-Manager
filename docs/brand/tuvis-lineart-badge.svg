<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tuvis 兔维斯 · 线稿徽章版 v1 —— 头像 + 胡萝卜角标 -->
  <!-- 线稿纪律：单色描边 + 白底填充，全图只允许两个点睛色（电光蓝眼睛 / 橙色胡萝卜） -->
  <defs>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 耳朵（白底填充遮住后画的头圆弧，保持线稿交界干净） -->
  <g fill="#FFFFFF" stroke="#2A3440" stroke-width="10">
    <g transform="rotate(-16 188 236)">
      <rect x="156" y="42" width="64" height="200" rx="32"/>
    </g>
    <g transform="rotate(16 324 236)">
      <rect x="292" y="42" width="64" height="200" rx="32"/>
    </g>
  </g>
  <!-- 耳尖科技环（点睛色一） -->
  <circle cx="151" cy="100" r="12" fill="none" stroke="#35C8FF" stroke-width="8"/>
  <circle cx="361" cy="100" r="12" fill="none" stroke="#35C8FF" stroke-width="8"/>

  <!-- 头 -->
  <circle cx="256" cy="266" r="136" fill="#FFFFFF" stroke="#2A3440" stroke-width="10"/>

  <!-- 侧声呐罩 -->
  <circle cx="124" cy="274" r="24" fill="#FFFFFF" stroke="#2A3440" stroke-width="10"/>
  <circle cx="388" cy="274" r="24" fill="#FFFFFF" stroke="#2A3440" stroke-width="10"/>
  <circle cx="124" cy="274" r="7" fill="#35C8FF"/>
  <circle cx="388" cy="274" r="7" fill="#35C8FF"/>

  <!-- 面罩 + 双眼（点睛色二区域：电光蓝） -->
  <rect x="146" y="224" width="220" height="72" rx="36" fill="#1E2836" stroke="#2A3440" stroke-width="10"/>
  <rect x="192" y="238" width="34" height="44" rx="17" fill="#35C8FF"/>
  <rect x="286" y="238" width="34" height="44" rx="17" fill="#35C8FF"/>

  <!-- 胡萝卜角标（右下，微倾，带绿色辉光呼应状态灯） -->
  <circle cx="382" cy="404" r="52" fill="url(#glow2)"/>
  <g transform="rotate(18 382 404)">
    <rect x="374" y="336" width="16" height="34" rx="8" fill="none" stroke="#4ADE80" stroke-width="7"/>
    <rect x="361" y="342" width="16" height="30" rx="8" fill="none" stroke="#4ADE80" stroke-width="7" transform="rotate(-26 369 357)"/>
    <rect x="387" y="342" width="16" height="30" rx="8" fill="none" stroke="#4ADE80" stroke-width="7" transform="rotate(26 395 357)"/>
    <path d="M358,376 Q382,366 406,376 L390,420 Q382,431 374,420 Z"
          fill="#FF8A3D" stroke="#2A3440" stroke-width="9" stroke-linejoin="round"/>
    <line x1="366" y1="392" x2="398" y2="392" stroke="#E2711D" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
