<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tuvis 兔维斯 吉祥物草稿 v1 —— 机甲兔 · 胸口胡萝卜状态灯 -->
  <!-- 参数表见同目录 DESIGN-SPEC.md；状态灯换色：只改 glow 渐变 2 个 stop + 灯芯 1 个 fill -->
  <defs>
    <!-- 状态灯辉光：绿=运行（默认）；黄 #FBBF24 / 红 #F87171 待换 -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <!-- 装甲银白：上亮下暗 -->
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#DEE5EE"/>
    </linearGradient>
    <!-- 胡萝卜橙：上浅下深 -->
    <linearGradient id="carrotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB067"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </linearGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="256" cy="502" rx="132" ry="10" fill="#2A3440" opacity="0.12"/>

  <!-- 耳朵（画在头后面）：外耳 + 深色内耳 + 耳尖科技环 -->
  <g stroke="#2A3440" stroke-width="8">
    <g transform="rotate(-14 176 200)">
      <rect x="144" y="10" width="64" height="200" rx="32" fill="url(#armor)"/>
      <rect x="160" y="34" width="32" height="146" rx="16" fill="#1E2836" stroke="none"/>
      <circle cx="176" cy="74" r="12" fill="none" stroke="#35C8FF" stroke-width="6"/>
    </g>
    <g transform="rotate(14 336 200)">
      <rect x="304" y="10" width="64" height="200" rx="32" fill="url(#armor)"/>
      <rect x="320" y="34" width="32" height="146" rx="16" fill="#1E2836" stroke="none"/>
      <circle cx="336" cy="74" r="12" fill="none" stroke="#35C8FF" stroke-width="6"/>
    </g>
  </g>

  <!-- 头：大圆 + 两侧机甲声呐罩 -->
  <circle cx="256" cy="222" r="136" fill="url(#armor)" stroke="#2A3440" stroke-width="8"/>
  <g fill="#1E2836" stroke="#2A3440" stroke-width="8">
    <circle cx="122" cy="230" r="26"/>
    <circle cx="390" cy="230" r="26"/>
  </g>
  <circle cx="122" cy="230" r="7" fill="#35C8FF"/>
  <circle cx="390" cy="230" r="7" fill="#35C8FF"/>

  <!-- HUD 面罩 + 双眼（电光蓝） -->
  <rect x="138" y="180" width="236" height="76" rx="38" fill="#1E2836" stroke="#2A3440" stroke-width="8"/>
  <g fill="#35C8FF">
    <rect x="192" y="196" width="36" height="46" rx="18"/>
    <rect x="284" y="196" width="36" height="46" rx="18"/>
  </g>
  <g fill="#BDEBFF" opacity="0.9">
    <rect x="200" y="204" width="14" height="18" rx="7"/>
    <rect x="292" y="204" width="14" height="18" rx="7"/>
  </g>

  <!-- 手臂（画在身体后面，向内收拢与躯干相接） -->
  <g fill="url(#armor)" stroke="#2A3440" stroke-width="8">
    <rect x="132" y="346" width="48" height="116" rx="24"/>
    <rect x="332" y="346" width="48" height="116" rx="24"/>
  </g>

  <!-- 身体 + 腹甲 -->
  <rect x="162" y="336" width="188" height="142" rx="46" fill="url(#armor)" stroke="#2A3440" stroke-width="8"/>
  <rect x="190" y="370" width="132" height="94" rx="30" fill="#EDF2F8" stroke="#C3CDDA" stroke-width="5"/>

  <!-- 脚（画在身体前面，向下露出） -->
  <g fill="url(#armor)" stroke="#2A3440" stroke-width="8">
    <rect x="170" y="458" width="66" height="48" rx="24"/>
    <rect x="276" y="458" width="66" height="48" rx="24"/>
  </g>

  <!-- 胸口胡萝卜状态灯：辉光 + 胡萝卜体 + 灯芯 + 叶子 -->
  <circle cx="256" cy="416" r="70" fill="url(#glow)"/>
  <g transform="rotate(-28 256 380)">
    <rect x="247" y="348" width="18" height="40" rx="9" fill="#4ADE80" stroke="#2A3440" stroke-width="6"/>
  </g>
  <g transform="rotate(28 256 380)">
    <rect x="247" y="348" width="18" height="40" rx="9" fill="#4ADE80" stroke="#2A3440" stroke-width="6"/>
  </g>
  <rect x="247" y="344" width="18" height="40" rx="9" fill="#4ADE80" stroke="#2A3440" stroke-width="6"/>
  <path d="M228,388 Q256,376 284,388 L265,438 Q256,450 247,438 Z"
        fill="url(#carrotGrad)" stroke="#2A3440" stroke-width="8" stroke-linejoin="round"/>
  <g stroke="#E2711D" stroke-width="5" stroke-linecap="round">
    <line x1="238" y1="404" x2="274" y2="404"/>
    <line x1="243" y1="420" x2="269" y2="420"/>
  </g>
  <!-- 灯芯（亮起）：绿色=运行；黄 #FEF3C7 / 红 #FEE2E2 待换 -->
  <rect x="248" y="396" width="16" height="30" rx="8" fill="#D1FAE5"/>
</svg>
