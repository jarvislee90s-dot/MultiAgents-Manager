[package]
name = "multi-agents-manager"
version = "0.4.1"
description = "多 Agent 编程工具统一管理平台"
authors = ["jarvis"]
edition = "2021"
# src/bin/mam-marker.rs（issue #43 marker helper）加入后仓库存在两个 bin，
# 不指定 default-run 时 `cargo run` / `pnpm tauri:dev` 报
# "could not determine which binary to run"（2026-09-11 Windows 实机验收发现 1）
default-run = "multi-agents-manager"

[features]
# mam-marker helper 的构建门（默认关）：helper 是 Windows-only 功能，而 macOS
# universal 打包只对主二进制 lipo（tauri-cli desktop.rs build_target），额外 bin
# 会被打包器要求存在于 universal 目录而必然失败（2026-09-14 v0.4.0 tag 构建实证，
# 9 月 10 日草稿能构建成功是当时 src/bin/mam-marker.rs 尚不存在）。Windows 发布
# 构建（release.yml）与 CI windows-gnu 门禁显式 `--features marker-helper`；
# 本地需要构建 helper 时同理。声明 [[bin]] 后 bin 自动发现关闭，两个 bin 均显式声明
marker-helper = []

[[bin]]
name = "multi-agents-manager"
path = "src/main.rs"

[[bin]]
name = "mam-marker"
path = "src/bin/mam-marker.rs"
required-features = ["marker-helper"]

[lib]
name = "multi_agents_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：Tauri v2/macOS 下透明窗口（主窗 + 通知浮窗均 transparent: true）的
# feature 门，须与 tauri.conf.json 的 app.macOSPrivateApi 成对出现；
# 该 feature 在 tauri 内部由 cfg(target_os = "macos") 门控，非 macOS 平台为空操作
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order（issue #36-5）：Map 用 IndexMap 保序——写回 ~/.claude.json 等
# JSON 工具配置时不再把整个文件按字母序重排（TOML/JSONC 路径本就保序）
serde_json = { version = "1", features = ["preserve_order"] }
sysinfo = "0.32"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
rusqlite = { version = "0.32", features = ["bundled"] }
dashmap = "6"
tokio = { version = "1", features = ["full"] }
fs2 = "0.4"
notify = "7"
toml = "0.8"
toml_edit = "0.22"
trash = "5"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = "4"
# dsh 会话日志为多帧拼接的 zstd 容器（M0 F1），解码用
zstd = "0.13"
tauri-plugin-dialog = "2"
# M2（远程接入）：主进程内嵌 axum 服务器 + 看板静态资源内嵌
axum = "0.8"
# include-exclude：支持 #[exclude = ".gitkeep"]（占位文件不嵌入二进制，终审修复轮）
rust-embed = { version = "8", features = ["include-exclude"] }
# 配对码 / deviceId 生成
rand = "0.8"

[target.'cfg(windows)'.dependencies]
junction = "1.2"
# Console（AttachConsole/SetConsoleTitle 路线 B）、Diagnostics_ToolHelp + FileSystem
# （父进程链遍历）为 mam-marker helper（src/bin）所需
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.52"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
# M2 axum 集成测试：tower ServiceExt::oneshot + http-body-util 读响应体
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
