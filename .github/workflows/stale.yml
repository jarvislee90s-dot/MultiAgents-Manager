name: Close Stale Issues
on:
  schedule:
    - cron: "0 0 * * *"
jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "此 issue 已闲置 60 天，如仍需处理请评论。"
          days-before-stale: 60
          days-before-close: 7
          # 依赖升级 PR 按「月度人工批处理」的节奏可能长期挂着（待排期的 major 迁移），
          # 不能被陈旧清理静默关掉：-1 = 不处理 PR（只清理 issue）。
          days-before-pr-stale: -1
